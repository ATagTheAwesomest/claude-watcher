name: Release

# Builds the plugin and publishes a GitHub release with the three files
# Obsidian and BRAT install: manifest.json, main.js and styles.css.
#
# Runs when a version tag such as 0.1.0 is pushed, or by hand from the
# Actions tab, which tags the current commit with the version in
# manifest.json.

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check versions
        id: version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version" >&2
            exit 1
          fi
          if [ "$(node -p "require('./package.json').version")" != "$version" ]; then
            echo "package.json version does not match manifest.json version $version" >&2
            exit 1
          fi
          if [ "$(node -p "require('./versions.json')['$version'] ?? ''")" = "" ]; then
            echo "versions.json has no entry for $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            gh release upload "$VERSION" manifest.json main.js styles.css --clobber
          else
            gh release create "$VERSION" manifest.json main.js styles.css \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes "Download manifest.json, main.js and styles.css below, or install with BRAT. See the README for install steps."
          fi
